[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-loc"
version = "0.2.0"
description = "NovaLoc 新译 — 全离线游戏全文本汉化流水线：文本抽取、AI 翻译、字体补字、贴图文字重绘"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "starchfurrycon" }]
keywords = ["game", "translation", "localization", "chinese", "ocr", "inpainting", "unity", "renpy", "rpgmaker"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "fonttools[woff]>=4.53",
  "pillow>=10.3",
  "numpy>=1.26",
  # 只用 OpenCV 的无 GUI 功能（图像读写/缩放/几何变换/修补）。
  #
  # **刻意不声明 opencv-python-headless**：`rapidocr` 依赖
  # `opencv-python`（带 GUI 的那个），而两者提供**同一个 `cv2` 包名**
  # 与同名文件，pip 不会报冲突，只是后装的那个覆盖前一个。实测两者会
  # 同时存在，`cv2.imshow` 也存在 —— 我们声明的 headless 实际上被
  # 完全覆盖，纯粹是噪音（还让 `pip list` 看起来像个坏环境）。
  #
  # 代码里没有一处用到 GUI 函数（已核实无 imshow/waitKey/namedWindow），
  # 所以带 GUI 的发行版完全可以满足需求。这里是让声明与事实一致。
  # 想彻底去掉 GUI 依赖的话：卸掉两者后单独装 opencv-python-headless
  # （此时不要再装 rapidocr 的 opencv 依赖），见 README 的说明。
  "opencv-python>=4.10",
  # 注意：onnxruntime **不在这里**。基础依赖里放 onnxruntime 会和
  # onnxruntime-directml 冲突（两者提供同一个 `onnxruntime` 包名），
  # 用户装完会发现 DirectML provider 消失、退回 CPU 慢 84 倍。
  # 所以推理后端必须由用户通过 extra 显式选择：dml / gpu / cpu 三选一。
  "typer>=0.12",
  "rich>=13.7",
  "sqlmodel>=0.0.22",
  "platformdirs>=4.2",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "tomli-w>=1.0",
  "scipy>=1.11",
  "pyclipper>=1.3",
  "shapely>=2.0",
]

[project.optional-dependencies]
# DirectML：Windows 上的 GPU 加速。**实测比 CPU 快 84 倍**，强烈建议装。
# 注意：onnxruntime-directml 与 onnxruntime / onnxruntime-gpu **互斥**，
# 装了这个就要卸掉另外两个，否则 DirectML provider 不会出现。
dml = ["onnxruntime-directml>=1.18"]
# 纯 CPU 推理（没有独显时用这个，但会慢很多）
cpu = ["onnxruntime>=1.18"]
# 前端构建产物随包分发，所以 web 这个 extra 只用于开发时重建前端
web = []
# 本地 GPU 推理（CUDA；DirectML 不可用时才需要）
gpu = ["onnxruntime-gpu>=1.18"]
# OCR 引擎。rapidocr 会自带 PP-OCRv6 的模型下载逻辑
ocr = ["rapidocr>=3.0"]
# 视觉大模型（贴图文字识别兜底）——体积大，按需安装
vision = ["transformers>=4.45", "accelerate>=0.34", "qwen-vl-utils>=0.0.8"]
# 本地图像修复（LaMa 等）。没有 torch 时去字会退化为纯色/Telea 修补
inpaint = ["torch>=2.4", "scikit-image>=0.24"]
# 开发
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
novaloc = "novaloc.cli:app"

[project.urls]
Homepage = "https://github.com/starchfurrycon/novaloc"
Repository = "https://github.com/starchfurrycon/novaloc"
Issues = "https://github.com/starchfurrycon/novaloc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/novaloc"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501：行宽由 formatter 控制，硬折行反而更难读。
# B008：typer 的 `x: int = typer.Option(...)` 就是它推荐的写法。
# SIM105/SIM102/SIM117 是纯风格偏好，不改语义：
#   - SIM105 想让我把 `try/except/pass` 换成 `contextlib.suppress`。
#     项目里这些地方**都带解释性注释**说明为什么吞掉异常
#     （例如"事件循环已关闭"），换成 suppress 反而丢了上下文。
#   - SIM102 合并嵌套 if 会超过 110 列，或把"先判空再判条件"的
#     阅读顺序打散。
#   - SIM117 合并 with 会让 `open(...) as f, some_ctx() as g` 这种
#     长组合串成一行。
ignore = ["E501", "B008", "SIM105", "SIM102", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# UP042 建议 `class X(str, Enum)` → `enum.StrEnum`。本项目 target 是
# py311+，迁移是安全的（全部调用点都走 `.value`），但 5 个枚举分散在
# models.py，是一次独立的行为面改动（StrEnum 的 __str__ 返回取值而非
# "TextKind.DIALOGUE"，会改变日志/调试输出）。留作单独一次改动，
# 这里显式豁免而不是装作没这回事。
"src/novaloc/models.py" = ["UP042"]

[tool.pytest.ini_options]
# 早先写的是 ["tests"]，但仓库里**没有 tests/ 目录** ——
# pytest 会以 "no tests ran"（退出码 5）静默通过，CI 看起来是绿的
# 其实一条测试都没跑。真实测试套件在 tests/ 下，见该目录 README。
testpaths = ["tests"]
asyncio_mode = "auto"
