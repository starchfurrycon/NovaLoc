[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-loc"
version = "0.1.0"
description = "NovaLoc 新译 — 全离线游戏全文本汉化流水线：文本抽取、AI 翻译、字体补字、贴图文字重绘"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "starchfurrycon" }]
keywords = ["game", "translation", "localization", "chinese", "ocr", "inpainting", "unity", "renpy", "rpgmaker"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "fonttools[woff]>=4.53",
  "pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  # 注意：onnxruntime **不在这里**。基础依赖里放 onnxruntime 会和
  # onnxruntime-directml 冲突（两者提供同一个 `onnxruntime` 包名），
  # 用户装完会发现 DirectML provider 消失、退回 CPU 慢 84 倍。
  # 所以推理后端必须由用户通过 extra 显式选择：dml / gpu / cpu 三选一。
  "typer>=0.12",
  "rich>=13.7",
  "sqlmodel>=0.0.22",
  "platformdirs>=4.2",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "tomli-w>=1.0",
  "scipy>=1.11",
  "pyclipper>=1.3",
  "shapely>=2.0",
]

[project.optional-dependencies]
# DirectML：Windows 上的 GPU 加速。**实测比 CPU 快 84 倍**，强烈建议装。
# 注意：onnxruntime-directml 与 onnxruntime / onnxruntime-gpu **互斥**，
# 装了这个就要卸掉另外两个，否则 DirectML provider 不会出现。
dml = ["onnxruntime-directml>=1.18"]
# 纯 CPU 推理（没有独显时用这个，但会慢很多）
cpu = ["onnxruntime>=1.18"]
# 前端构建产物随包分发，所以 web 这个 extra 只用于开发时重建前端
web = []
# 本地 GPU 推理（CUDA；DirectML 不可用时才需要）
gpu = ["onnxruntime-gpu>=1.18"]
# OCR 引擎。rapidocr 会自带 PP-OCRv6 的模型下载逻辑
ocr = ["rapidocr>=3.0"]
# 视觉大模型（贴图文字识别兜底）——体积大，按需安装
vision = ["transformers>=4.45", "accelerate>=0.34", "qwen-vl-utils>=0.0.8"]
# 本地图像修复（LaMa 等）。没有 torch 时去字会退化为纯色/Telea 修补
inpaint = ["torch>=2.4", "scikit-image>=0.24"]
# 开发
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
novaloc = "novaloc.cli:app"

[project.urls]
Homepage = "https://github.com/starchfurrycon/novaloc"
Repository = "https://github.com/starchfurrycon/novaloc"
Issues = "https://github.com/starchfurrycon/novaloc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/novaloc"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
